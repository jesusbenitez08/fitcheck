<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitCheck</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>FitCheck</h1>
        <p class="subtitle">Compare a resume with a job description and get a quick match overview.</p>


        <form action="/analyze" method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label for="resume_file">Upload Resume (PDF)</label>
                <input type="file" id="resume_file" name="resume_file" accept=".pdf">
            </div>

            <p style="font-size: 14px; color: #64748b;">
                You can paste your resume text or upload a PDF.
            </p>

            <div class="form-group">
                <label for="resume_text">Paste Resume Text</label>
                <textarea id="resume_text" name="resume_text" placeholder="Paste resume text here..."></textarea>
            </div>

            <div class="form-group">
                <label for="job_text">Paste Job Description</label>
                <textarea id="job_text" name="job_text" placeholder="Paste job description here..." required></textarea>
            </div>

            <button type="submit">Analyze Resume</button>

        </form>
    </div>
</body>
</html>
