<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitCheck</title>
</head>
<body>
    <h1>FitCheck</h1>
    <p>Compare a resume with a job description</p>

    <form action="/analyze" method="POST">
        <div>
            <label for="resume_text"><strong>Paste Resume Text</strong></label><br>
            <textarea id="resume_text" name="resume_text" rows="10" cols="70" placeholder="Paste resume text here..." required></textarea>
        </div>

        <br>

        <div>
            <label for="job_text"><strong>Paste Job Description</strong></label><br>
            <textarea id="job_text" name="job_text" rows="10" cols="70" placeholder="Paste job description here..." required></textarea>
        </div>

        <br>

        <button type="submit">Analyze Resume</button>
    </form>
</body>
</html>
